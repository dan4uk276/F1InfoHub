<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Profile | Formula 1</title>

    <!-- Global Styles -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/variables.css">

    <!-- Header Component Styles -->
    <link rel="stylesheet" href="../../components/header/header.css">

    <!-- Page Styles -->
    <link rel="stylesheet" href="driverProfile.css">
    <link rel="stylesheet" href="../../components/latestVideos/latestVideos.css">
    <link rel="stylesheet" href="../../components/driverHeroSection/renderDriverHeroSection.css">
    <link rel="stylesheet" href="../../components/statistics/statistics.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <!-- Page Script -->
    <script type="module" src="driverProfile.js"></script>
    <script type="module" src="../../components/latestVideos/latestVideos.js"></script>
</head>
<body>
<!-- Header will be injected here by JavaScript -->

<main class="driver-profile">

    <!-- Back Button -->
    <div class="container">
        <button class="back-button" onclick="window.location.href='../allDrivers/'">
            ← Back to Drivers
        </button>
    </div>

    <div id="hero-placeholder"></div>


    <section id="stats-section"></section>


    <div class="container">
        <div class="section-divider-wrapper">
            <span class="section-divider top"></span>
            <span class="section-divider bottom"></span>
        </div>
    </div>

    <!-- Biography Section -->
    <section class="bio-section">
        <div class="container">
            <div class="bio-content">
                <div class="bio-header">
                    <h2>Biography</h2>
                    <div class="bio-info-cards">
                        <!-- Bio info will be injected by JS -->
                    </div>
                </div>
                <div class="bio-text">
                    <!-- Biography text will be injected by JS -->
                </div>
            </div>
        </div>
    </section>

    <!-- Related Content Section -->
    <section class="related-section">
        <div class="container">
            <h2 class="section-title">Latest Videos</h2>
            <div class="related-grid">
                <!-- Related content will be injected by JS -->
            </div>
        </div>
    </section>
</main>

<!-- Video Modal -->
<div class="video-modal-overlay" id="videoModal">
    <div class="video-modal-content">
        <iframe id="videoModalIframe" width="100%" height="100%" frameborder="0"
                allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
                allowfullscreen>
        </iframe>
    </div>
</div>

</body>
</html>
