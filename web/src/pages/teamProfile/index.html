<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Details | Formula 1</title>
    <!-- Global Styles -->
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">

    <!-- Header Component Styles -->
    <link rel="stylesheet" href="../../components/header/header.css">

    <link rel="stylesheet" href="teamProfile.css">
    <link rel="stylesheet" href="../../components/latestVideos/latestVideos.css">
    <link rel="stylesheet" href="../../components/teamHeroSection/renderTeamHeroSection.css">
    <link rel="stylesheet" href="../../components/driverCard/createDriverCard.css">
    <link rel="stylesheet" href="../../components/statistics/statistics.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Page Script -->
    <script type="module" src="teamProfile.js"></script>

</head>
<body>

<!-- Main Content -->
<main class="team-profile">
    <!-- Back Button -->
    <div class="container">
        <button class="back-button" onclick="window.location.href='../allTeams/'">
            ← Back to Teams
        </button>
    </div>

    <!-- Hero Section -->
    <div id="hero-placeholder"></div>
    <!-- Drivers Section -->
    <section class="drivers-section">
        <div class="container">
            <h2 class="section-title">Drivers</h2>
            <div class="drivers-grid"></div>
        </div>
    </section>

    <div class="container">
        <div class="section-divider-wrapper">
            <span class="section-divider top"></span>
            <span class="section-divider bottom"></span>
        </div>
    </div>

    <section id="stats-section"></section>


    <div class="container">
        <div class="section-divider-wrapper">
            <span class="section-divider top"></span>
            <span class="section-divider bottom"></span>
        </div>
    </div>

    <!-- Team Profile Section -->
    <section class="profile-section">
        <div class="container">
            <div class="profile-content">
                <div class="profile-header">
                    <h2>Team Profile</h2>
                    <div class="profile-info-cards"></div>
                </div>
                <div class="profile-text"></div>
            </div>
        </div>
    </section>

    <section class="related-section">
        <div class="container">
            <h2 class="section-title">Latest Videos</h2>
            <div class="related-grid">
                <!-- Related content will be injected by JS -->
            </div>
        </div>
    </section>

    <div class="video-modal-overlay" id="videoModal">
        <div class="video-modal-content">
            <iframe id="videoModalIframe" width="100%" height="100%" frameborder="0"
                    allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
                    allowfullscreen>
            </iframe>
        </div>
    </div>
</main>

<!-- Footer will be injected here -->
<div id="footer-container"></div>
</body>
</html>
